name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add clippy rustfmt

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: verify-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Check tag matches crate version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          crate_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$crate_version" = "$tag_version" || {
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $crate_version"
            exit 1
          }

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Verify standalone release binary
        shell: bash
        run: |
          cargo build --release --locked
          bundle="$(mktemp -d)"
          cp target/release/quick "$bundle/quick"
          cd "$bundle"
          ./quick serve --listen 127.0.0.1:18080 >quick.log 2>&1 &
          quick_pid=$!
          trap 'kill "$quick_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent \
              --header "Host: localhost:18080" \
              http://127.0.0.1:18080/ >homepage.html; then
              break
            fi
            sleep 0.25
          done
          grep --fixed-strings "quick-dashboard-bundle-v1" homepage.html
          test ! -e dashboard.html
          test ! -d src

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    env:
      RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'manual' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            executable: quick
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            executable: quick
            musl: true
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            executable: quick
          - runner: macos-15
            target: aarch64-apple-darwin
            executable: quick
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            executable: quick.exe
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust target
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "${{ matrix.target }}"

      - name: Install musl toolchain
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}

      - name: Build release binary
        if: ${{ !matrix.musl }}
        shell: bash
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Build static musl release binary
        if: matrix.musl
        shell: bash
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Verify standalone binary on Linux and macOS
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bundle="$(mktemp -d)"
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" "$bundle/quick"
          cd "$bundle"
          chmod +x quick
          ./quick serve --listen 127.0.0.1:18080 >quick.log 2>&1 &
          quick_pid=$!
          trap 'kill "$quick_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent \
              --header "Host: localhost:18080" \
              http://127.0.0.1:18080/ >homepage.html; then
              break
            fi
            sleep 0.25
          done
          grep --fixed-strings "quick-dashboard-bundle-v1" homepage.html
          test ! -e dashboard.html
          test ! -d src

      - name: Verify standalone binary on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP "quick-smoke"
          New-Item -ItemType Directory -Path $bundle -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.executable }}" "$bundle/quick.exe"
          Push-Location $bundle
          $process = Start-Process `
            -FilePath ".\quick.exe" `
            -ArgumentList "serve", "--listen", "127.0.0.1:18080" `
            -RedirectStandardOutput "quick.log" `
            -RedirectStandardError "quick-error.log" `
            -PassThru
          try {
            $homepage = $null
            foreach ($attempt in 1..20) {
              try {
                $homepage = Invoke-WebRequest `
                  -Uri "http://127.0.0.1:18080/" `
                  -Headers @{ Host = "localhost:18080" } `
                  -UseBasicParsing
                break
              } catch {
                Start-Sleep -Milliseconds 250
              }
            }
            if ($null -eq $homepage) {
              Get-Content "quick.log", "quick-error.log" -ErrorAction SilentlyContinue
              throw "Quick did not start on Windows"
            }
            if (-not $homepage.Content.Contains("quick-dashboard-bundle-v1")) {
              throw "The embedded dashboard marker is missing"
            }
            if (Test-Path "dashboard.html") {
              throw "The binary unexpectedly requires dashboard.html"
            }
          } finally {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            Pop-Location
          }

      - name: Package Linux and macOS archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          package="quick-${RELEASE_VERSION}-${{ matrix.target }}"
          mkdir -p "dist/$package"
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" "dist/$package/"
          cp README.md "dist/$package/"
          tar -C dist -czf "dist/$package.tar.gz" "$package"
          shasum -a 256 "dist/$package.tar.gz" > "dist/$package.tar.gz.sha256"

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = "quick-$env:RELEASE_VERSION-${{ matrix.target }}"
          $packageDirectory = Join-Path "dist" $package
          New-Item -ItemType Directory -Path $packageDirectory -Force | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.executable }}" $packageDirectory
          Copy-Item "README.md" $packageDirectory
          $archive = Join-Path "dist" "$package.zip"
          Compress-Archive -Path $packageDirectory -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          "$hash  $package.zip" | Set-Content -Encoding ascii "$archive.sha256"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quick-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.tar.gz \
            dist/*.zip \
            dist/*.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "Quick $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
