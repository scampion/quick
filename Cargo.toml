[package]
name = "quick"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A small internal static hosting platform inspired by Shopify Quick"
repository = "https://github.com/scampion/quick"
readme = "README.md"

[dependencies]
async-trait = "0.1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
http = "1.3"
mime_guess = "2.0"
pingora = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.20"

[profile.release]
lto = "thin"
strip = "symbols"
